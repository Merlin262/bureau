name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Interface
        working-directory: web
        run: npm ci && npm run check && npm run build && npm run build:app

      - name: Backend
        run: dotnet build server/Bureau.csproj -c Release -warnaserror
